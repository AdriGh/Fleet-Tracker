# nginx del sitio de marketing Rigsmith (estatico, detras del Traefik de
# Dokploy que termina TLS). SPA fallback para React Router + headers de
# seguridad espejando el criterio de la app (SEC-5), adaptados a sitio
# estatico. HSTS queda para cuando haya dominio propio definitivo.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.unsplash.com; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Assets con hash en el nombre: cache fuerte e inmutable.
  # (add_header en un location pisa los del server: repetir el critico.)
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # SPA: cualquier ruta (features/pricing/about) cae al index.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
