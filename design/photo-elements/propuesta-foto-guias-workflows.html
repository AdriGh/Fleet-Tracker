<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rigsmith · Propuesta: Fotos, Guías y Workflows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
/* ===== Tokens Rigsmith (copiados de frontend/src/index.css, tema dark) ===== */
:root {
  --brand: #e11900; --accent: #e11900; --accent-2: #ff4d3d;
  --accent-strong: #b71400; --accent-soft: rgba(225,25,0,0.14);
  --bg: #0a0a0b; --surface: #161618; --surface-2: #100f11; --surface-3: #1e1e21;
  --text: #f4f4f5; --text-muted: #a1a1aa;
  --border: #27272b; --border-strong: #3a3a40;
  --ui-danger: #f43f5e; --ui-success: #34d399; --ui-warn: #fbbf24; --ui-info: #38bdf8;
  --st-overdue: #ef4444; --st-upcoming: #eab308; --st-on-track: #22c55e;
  --radius: 16px; --radius-lg: 22px; --radius-sm: 10px; --radius-pill: 999px; --radius-btn: 11px;
  --font: "Inter", system-ui, sans-serif;
  --font-display: "Space Grotesk", "Inter", sans-serif;
  --shadow-md: 0 16px 40px -16px rgba(0,0,0,0.55), 0 4px 14px -8px rgba(0,0,0,0.4);
  --glow-accent: 0 2px 8px -1px rgba(226,35,26,0.45);
}
* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font);
  font-size: 15px; line-height: 1.5;
}
img { display: block; }
button { font-family: inherit; cursor: pointer; }

/* ===== Chrome del board (esto NO es la app: es el documento de propuesta) ===== */
.board { max-width: 1240px; margin: 0 auto; padding: 40px 32px 96px; }
.board-head { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
.board-logo { width: 44px; height: 44px; border-radius: 12px; background: #1c1c1f;
  border: 1px solid var(--border-strong); display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 22px; font-style: italic; }
.board-logo b { color: var(--text); } .board-logo span { color: var(--brand); }
.board-title { font-family: var(--font-display); font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
.board-sub { color: var(--text-muted); max-width: 760px; margin-bottom: 20px; }
.assump { background: var(--surface-2); border: 1px dashed var(--border-strong);
  border-radius: var(--radius); padding: 14px 18px; margin-bottom: 36px; font-size: 13px; color: var(--text-muted); }
.assump b { color: var(--text); }
.toc { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 44px; }
.toc a { text-decoration: none; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-pill);
  padding: 7px 15px; font-size: 13px; font-weight: 600; transition: border-color .15s; }
.toc a:hover { border-color: var(--accent-2); }
.toc a .n { color: var(--brand); font-family: var(--font-display); margin-right: 6px; }

.sec { margin-bottom: 72px; scroll-margin-top: 24px; }
.sec-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
.sec-num { font-family: var(--font-display); font-style: italic; font-weight: 700;
  font-size: 2.4rem; color: var(--brand); line-height: 1; }
.sec-title { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
.sec-chips { display: flex; gap: 6px; }
.chip { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 3px 9px; border-radius: var(--radius-pill); border: 1px solid var(--border-strong); color: var(--text-muted); }
.chip.driver { color: var(--ui-info); border-color: rgba(56,189,248,.35); }
.chip.manager { color: var(--ui-warn); border-color: rgba(251,191,36,.35); }
.chip.effort { color: var(--ui-success); border-color: rgba(52,211,153,.35); }
.sec-why { color: var(--text-muted); max-width: 820px; margin-bottom: 22px; font-size: 14px; }
.sec-why b { color: var(--text); }
.demo-note { font-size: 12px; color: var(--text-muted); font-style: italic; margin-top: 10px; }

/* ===== Superficies "app real" dentro de cada demo ===== */
.app-panel { background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-md); overflow: hidden; }
.app-panel-head { padding: 14px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.app-panel-title { font-family: var(--font-display); font-weight: 700; font-size: 15.5px; }
.pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: var(--radius-pill); }
.pill.red { background: rgba(239,68,68,.16); color: #f87171; }
.pill.green { background: rgba(34,197,94,.14); color: #4ade80; }
.pill.yellow { background: rgba(234,179,8,.15); color: #facc15; }
.btn { border: none; border-radius: var(--radius-btn); font-weight: 700; font-size: 13.5px;
  padding: 9px 16px; transition: transform .12s, box-shadow .15s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--brand); color: #fff; box-shadow: var(--glow-accent); }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border-strong); }
.btn.sm { padding: 6px 12px; font-size: 12.5px; }

/* S1 evidencia */
.s1-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 24px; align-items: start; }
.s1-defect-row { display: flex; gap: 14px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.s1-defect-row:last-child { border-bottom: none; }
.s1-rail { width: 4px; border-radius: 4px; align-self: stretch; }
.s1-thumbs { display: flex; gap: 6px; margin-top: 10px; }
.s1-thumb { width: 74px; height: 56px; border-radius: 8px; object-fit: cover; cursor: zoom-in;
  border: 1px solid var(--border-strong); transition: transform .15s, border-color .15s; }
.s1-thumb:hover { transform: scale(1.05); border-color: var(--accent-2); }
.s1-thumb-more { width: 74px; height: 56px; border-radius: 8px; border: 1px dashed var(--border-strong);
  display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--text-muted); }
.s1-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.s1-lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.82); z-index: 300;
  display: grid; place-items: center; cursor: zoom-out; backdrop-filter: blur(6px); }
.s1-lightbox-inner { position: relative; max-width: min(880px, 92vw); }
.s1-lightbox img { width: 100%; border-radius: var(--radius); box-shadow: var(--shadow-md); }
.s1-pin { position: absolute; width: 34px; height: 34px; border-radius: 50%;
  background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 800;
  border: 3px solid #fff; box-shadow: 0 4px 14px rgba(0,0,0,.5); animation: s1pulse 1.6s infinite; }
@keyframes s1pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(225,25,0,.5);} 55% { box-shadow: 0 0 0 14px rgba(225,25,0,0);} }
.s1-caption { position: absolute; left: 16px; bottom: 16px; background: rgba(10,10,11,.85);
  border: 1px solid var(--border-strong); padding: 8px 14px; border-radius: 10px; font-size: 13px; }
/* before/after */
.s1-ba { position: relative; border-radius: var(--radius); overflow: hidden; aspect-ratio: 16/10;
  border: 1px solid var(--border); user-select: none; }
.s1-ba img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.s1-ba-clip { position: absolute; inset: 0; overflow: hidden; }
.s1-ba-bar { position: absolute; top: 0; bottom: 0; width: 3px; background: #fff; cursor: ew-resize;
  box-shadow: 0 0 12px rgba(0,0,0,.8); }
.s1-ba-knob { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 38px; height: 38px; border-radius: 50%; background: #fff; color: #111;
  display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.s1-ba-tag { position: absolute; top: 12px; font-size: 11px; font-weight: 800;
  letter-spacing: .1em; padding: 4px 10px; border-radius: 6px; }
.s1-ba input[type=range] { position: absolute; inset: 0; width: 100%; height: 100%;
  opacity: 0; cursor: ew-resize; margin: 0; }

/* S2 walkaround — pantalla driver */
.s2-wrap { display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap; }
.s2-screen { height: 100%; display: flex; flex-direction: column;
  background: #0e0e10; color: var(--text); font-family: var(--font); }
.s2-top { padding: 14px 18px 10px; }
.s2-prog { display: flex; gap: 5px; margin-bottom: 12px; }
.s2-prog i { height: 4px; flex: 1; border-radius: 4px; background: var(--surface-3); }
.s2-prog i.done { background: var(--ui-success); }
.s2-prog i.cur { background: var(--brand); }
.s2-zone-eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--text-muted); font-weight: 700; }
.s2-zone-name { font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
.s2-photo { margin: 10px 18px; border-radius: 14px; overflow: hidden; position: relative;
  aspect-ratio: 4/3; background: var(--surface-2); border: 1px dashed var(--border-strong);
  display: grid; place-items: center; }
.s2-photo.filled { border-style: solid; }
.s2-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.s2-photo-cta { display: flex; flex-direction: column; align-items: center; gap: 8px;
  color: var(--text-muted); font-size: 13px; font-weight: 600; z-index: 1; }
.s2-cam { width: 52px; height: 52px; border-radius: 50%; background: var(--brand);
  display: grid; place-items: center; box-shadow: var(--glow-accent); font-size: 22px; }
.s2-shot-ok { position: absolute; right: 10px; top: 10px; background: rgba(16,185,129,.9);
  color: #fff; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 999px; }
.s2-verdict { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 18px 10px; }
.s2-verdict button { padding: 13px; border-radius: 13px; font-size: 15px; font-weight: 800;
  border: 1.5px solid var(--border-strong); background: var(--surface); color: var(--text); }
.s2-verdict button.ok.sel { background: rgba(34,197,94,.15); border-color: var(--st-on-track); color: #4ade80; }
.s2-verdict button.bad.sel { background: rgba(239,68,68,.14); border-color: var(--st-overdue); color: #f87171; }
.s2-note { margin: 0 18px 10px; }
.s2-note textarea { width: 100%; background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: 12px; padding: 10px 12px;
  font-family: inherit; font-size: 13.5px; resize: none; }
.s2-foot { margin-top: auto; padding: 12px 18px 16px; display: flex; gap: 10px; }
.s2-foot .btn { flex: 1; padding: 13px; font-size: 15px; }
.s2-done { flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 10px; padding: 24px; text-align: center; }
.s2-done-badge { width: 76px; height: 76px; border-radius: 50%; background: rgba(34,197,94,.14);
  border: 2px solid var(--st-on-track); display: grid; place-items: center; font-size: 34px; }
.s2-side { flex: 1; min-width: 300px; max-width: 460px; }
.s2-side h4 { font-family: var(--font-display); margin-bottom: 10px; font-size: 15px; }
.s2-side ul { padding-left: 18px; color: var(--text-muted); font-size: 13.5px; display: grid; gap: 8px; }
.s2-side b { color: var(--text); }

/* S3 workflow editor */
.s3-wrap { display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; align-items: start; }
.s3-palette { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 20px; border-bottom: 1px solid var(--border); }
.s3-pal-btn { display: flex; align-items: center; gap: 7px; background: var(--surface-3);
  border: 1px solid var(--border-strong); color: var(--text); border-radius: var(--radius-btn);
  padding: 7px 12px; font-size: 12.5px; font-weight: 700; transition: border-color .15s; }
.s3-pal-btn:hover { border-color: var(--accent-2); }
.s3-steps { padding: 10px 12px 16px; display: grid; gap: 8px; }
.s3-step { display: flex; align-items: center; gap: 10px; background: var(--surface-2);
  border: 1.5px solid var(--border); border-radius: 13px; padding: 11px 12px; cursor: pointer;
  transition: border-color .15s, background .15s; }
.s3-step.sel { border-color: var(--brand); background: var(--accent-soft); }
.s3-step .grip { color: var(--text-muted); font-size: 15px; letter-spacing: -1px; cursor: grab; }
.s3-step .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
  font-size: 15px; background: var(--surface-3); border: 1px solid var(--border-strong); flex: none; }
.s3-step .lbl { flex: 1; min-width: 0; }
.s3-step .lbl b { display: block; font-size: 13.5px; }
.s3-step .lbl span { font-size: 11.5px; color: var(--text-muted); }
.s3-flags { display: flex; gap: 5px; }
.s3-flag { font-size: 10px; font-weight: 800; letter-spacing: .06em; padding: 2px 7px;
  border-radius: 6px; background: var(--surface-3); color: var(--text-muted); }
.s3-flag.on { background: rgba(225,25,0,.16); color: var(--accent-2); }
.s3-mv { display: flex; flex-direction: column; gap: 2px; }
.s3-mv button { background: none; border: none; color: var(--text-muted); font-size: 11px; padding: 1px 5px; }
.s3-mv button:hover { color: var(--text); }
.s3-config { border-top: 1px solid var(--border); padding: 14px 20px; display: grid; gap: 12px; }
.s3-config-row { display: flex; align-items: center; justify-content: space-between; font-size: 13.5px; }
.s3-toggle { width: 42px; height: 24px; border-radius: 999px; background: var(--surface-3);
  border: 1px solid var(--border-strong); position: relative; transition: background .15s; }
.s3-toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--text-muted); transition: transform .18s, background .15s; }
.s3-toggle.on { background: var(--brand); border-color: var(--brand); }
.s3-toggle.on::after { transform: translateX(18px); background: #fff; }
.s3-preview-wrap { position: sticky; top: 20px; }
.s3-preview-label { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 8px;
  font-style: italic; }
.s3-phone-scale { transform: scale(.62); transform-origin: top center; height: 560px; }
.s3-drv-step { display: flex; gap: 10px; align-items: center; padding: 12px 14px;
  border-bottom: 1px solid var(--border); }
.s3-drv-step .num { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-3);
  display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; }
.s3-drv-step .t { flex: 1; font-size: 14px; font-weight: 600; }
.s3-drv-step .req { font-size: 10px; color: var(--accent-2); font-weight: 800; letter-spacing: .06em; }

/* S4 guias */
.s4-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: start; }
.s4-variant-label { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 10px; }
.s4-coach-stage { position: relative; background: var(--surface-2); border-radius: var(--radius);
  border: 1px solid var(--border); padding: 18px; overflow: hidden; }
.s4-kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 13px;
  padding: 12px 14px; margin-bottom: 10px; transition: box-shadow .3s, border-color .3s; position: relative; }
.s4-kpi.spot { border-color: var(--accent-2); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow-md); z-index: 2; }
.s4-kpi .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }
.s4-kpi .v { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.s4-tip { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 13px;
  padding: 12px 14px; box-shadow: var(--shadow-md); }
.s4-tip p { font-size: 13px; margin: 4px 0 10px; color: var(--text-muted); }
.s4-tip b { font-size: 13.5px; }
.s4-tip-foot { display: flex; align-items: center; justify-content: space-between; }
.s4-tip-count { font-size: 11.5px; color: var(--text-muted); font-weight: 700; }
.s4-guide-item { display: flex; align-items: center; gap: 10px; padding: 9px 0;
  border-bottom: 1px solid var(--border); font-size: 13.5px; }
.s4-guide-item:last-child { border: none; }
.s4-check { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border-strong);
  display: grid; place-items: center; font-size: 11px; flex: none; }
.s4-check.done { background: var(--st-on-track); border-color: var(--st-on-track); color: #fff; }
.s4-gprog { height: 6px; border-radius: 6px; background: var(--surface-3); overflow: hidden; margin: 10px 0 14px; }
.s4-gprog i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--accent-2)); }
.s4-video { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 12px;
  border: 1px solid var(--border); margin-bottom: 8px; cursor: pointer; transition: border-color .15s; }
.s4-video:hover { border-color: var(--accent-2); }
.s4-video img { width: 92px; height: 60px; object-fit: cover; border-radius: 8px; }
.s4-video .play { position: absolute; inset: 0; display: grid; place-items: center; }
.s4-video .play i { width: 26px; height: 26px; border-radius: 50%; background: rgba(10,10,11,.7);
  display: grid; place-items: center; font-size: 10px; color: #fff; padding-left: 2px; }
.s4-video .vt { font-size: 13px; font-weight: 600; line-height: 1.3; }
.s4-video .vd { font-size: 11.5px; color: var(--text-muted); }
.s4-q { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%;
  background: var(--surface-3); border: 1px solid var(--border-strong); color: var(--text-muted);
  font-size: 10.5px; font-weight: 800; cursor: help; position: relative; }
.s4-q .pop { display: none; position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
  width: 230px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 11px;
  padding: 10px 12px; font-size: 12px; font-weight: 500; color: var(--text); text-align: left;
  box-shadow: var(--shadow-md); z-index: 10; }
.s4-q:hover .pop { display: block; }

/* S5 unidades */
.s5-toggle { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-pill); padding: 3px; margin-bottom: 18px; }
.s5-toggle button { border: none; background: none; color: var(--text-muted); font-weight: 700;
  font-size: 13px; padding: 7px 18px; border-radius: var(--radius-pill); }
.s5-toggle button.on { background: var(--brand); color: #fff; }
.s5-hero { position: relative; border-radius: var(--radius-lg); overflow: hidden;
  border: 1px solid var(--border); margin-bottom: 20px; aspect-ratio: 21/7; }
.s5-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.s5-hero .veil { position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(10,10,11,.92) 18%, rgba(10,10,11,.45) 55%, rgba(10,10,11,.15)); }
.s5-hero .inner { position: absolute; inset: 0; padding: 26px 30px; display: flex;
  flex-direction: column; justify-content: flex-end; }
.s5-hero .unit { font-family: var(--font-display); font-size: 2.3rem; font-weight: 700;
  font-style: italic; letter-spacing: -0.02em; line-height: 1; }
.s5-hero .sub { color: #d4d4d8; font-size: 13.5px; margin-top: 6px; }
.s5-hero .stats { display: flex; gap: 22px; margin-top: 14px; }
.s5-hero .st .l { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #a1a1aa; font-weight: 700; }
.s5-hero .st .v { font-family: var(--font-display); font-size: 19px; font-weight: 700; }
.s5-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.s5-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; transition: transform .15s, border-color .15s; cursor: pointer; }
.s5-card:hover { transform: translateY(-3px); border-color: var(--border-strong); }
.s5-card .ph { aspect-ratio: 16/9; overflow: hidden; position: relative; background: var(--surface-3); }
.s5-card .ph img { width: 100%; height: 100%; object-fit: cover; }

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef } = React;

/* ===== IosFrame (assets/ios_frame.jsx del skill, pegado sin modificar medidas) ===== */
const iosFrameStyles = {
  wrapper: { display: 'inline-block', padding: 12, background: '#000', borderRadius: 60,
    boxShadow: '0 0 0 2px #1f2937, 0 20px 60px rgba(0,0,0,0.3)', position: 'relative' },
  screen: { position: 'relative', borderRadius: 48, overflow: 'hidden', background: '#fff' },
  statusBar: { position: 'absolute', top: 0, left: 0, right: 0, height: 54, display: 'flex',
    alignItems: 'center', justifyContent: 'space-between', padding: '0 32px',
    fontSize: 16, fontWeight: 600, fontFamily: '-apple-system, "SF Pro Text", sans-serif',
    zIndex: 20, pointerEvents: 'none' },
  dynamicIsland: { position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)',
    width: 124, height: 36, background: '#000', borderRadius: 999, zIndex: 30 },
  statusIcons: { display: 'flex', alignItems: 'center', gap: 6 },
  signalIcon: { display: 'flex', alignItems: 'flex-end', gap: 2, height: 12 },
  signalBar: { width: 3, background: 'currentColor', borderRadius: 1 },
  batteryIcon: { width: 26, height: 12, border: '1.5px solid currentColor', borderRadius: 3,
    padding: 1, position: 'relative', opacity: 0.8 },
  batteryCap: { position: 'absolute', top: 3, right: -3, width: 2, height: 6,
    background: 'currentColor', borderRadius: '0 1px 1px 0' },
  content: { position: 'absolute', top: 54, left: 0, right: 0, bottom: 34, overflow: 'auto' },
  homeIndicator: { position: 'absolute', bottom: 10, left: '50%', transform: 'translateX(-50%)',
    width: 140, height: 5, background: 'rgba(255,255,255,0.5)', borderRadius: 999, zIndex: 10 },
};
function IosFrame({ children, width = 393, height = 852, time = '9:41', battery = 100 }) {
  const textColor = '#fff';
  return (
    <div style={iosFrameStyles.wrapper}>
      <div style={{ ...iosFrameStyles.screen, width, height, background: '#000' }}>
        <div style={{ ...iosFrameStyles.statusBar, color: textColor }}>
          <span>{time}</span>
          <div style={iosFrameStyles.statusIcons}>
            <div style={iosFrameStyles.signalIcon}>
              <div style={{ ...iosFrameStyles.signalBar, height: 4 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 6 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 9 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 11 }} />
            </div>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style={{ color: textColor }}>
              <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
              <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" />
              <path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.7" />
            </svg>
            <div style={iosFrameStyles.batteryIcon}>
              <div style={{ width: `${battery}%`, height: '100%', background: 'currentColor', borderRadius: 1, opacity: 0.9 }} />
              <div style={iosFrameStyles.batteryCap} />
            </div>
          </div>
        </div>
        <div style={iosFrameStyles.dynamicIsland} />
        <div style={iosFrameStyles.content}>{children}</div>
        <div style={iosFrameStyles.homeIndicator} />
      </div>
    </div>
  );
}

/* ============================================================
   S1 · Evidencia fotográfica en defectos y WOs
   ============================================================ */
function Lightbox({ img, caption, pin, onClose }) {
  return (
    <div className="s1-lightbox" onClick={onClose}>
      <div className="s1-lightbox-inner">
        <img src={img} alt="" />
        {pin && <div className="s1-pin" style={{ left: pin.x, top: pin.y }}>1</div>}
        <div className="s1-caption">{caption}</div>
      </div>
    </div>
  );
}

function BeforeAfter() {
  const [pos, setPos] = useState(52);
  return (
    <div className="s1-ba">
      <img src="img/truck_cascadia_1.jpg" alt="después" />
      <div className="s1-ba-clip" style={{ clipPath: `inset(0 ${100 - pos}% 0 0)` }}>
        <img src="img/defect_windshield.jpg" alt="antes" />
      </div>
      <span className="s1-ba-tag" style={{ left: 12, background: 'rgba(239,68,68,.85)', color: '#fff' }}>REPORTADO</span>
      <span className="s1-ba-tag" style={{ right: 12, background: 'rgba(34,197,94,.85)', color: '#fff' }}>EN SERVICIO</span>
      <div className="s1-ba-bar" style={{ left: `${pos}%` }}>
        <div className="s1-ba-knob">⇔</div>
      </div>
      <input type="range" min="2" max="98" value={pos} onChange={e => setPos(+e.target.value)} aria-label="comparar antes y después" />
    </div>
  );
}

function S1() {
  const [lb, setLb] = useState(null);
  return (
    <section className="sec" id="s1">
      <div className="sec-head">
        <span className="sec-num">01</span>
        <span className="sec-title">Evidencia fotográfica en defectos y Work Orders</span>
        <span className="sec-chips">
          <span className="chip driver">driver reporta</span>
          <span className="chip manager">manager verifica</span>
          <span className="chip effort">esfuerzo M</span>
        </span>
      </div>
      <p className="sec-why">
        Hoy un defecto es una línea de texto. Con foto, el mecánico sabe <b>qué va a encontrar antes de
        abrir el capó</b>, y la WO cierra con prueba visual — que además alimenta warranty y disputas
        con el shop externo. Es el elemento con mejor relación costo/impacto de toda la propuesta.
      </p>
      <div className="s1-grid">
        <div className="app-panel">
          <div className="app-panel-head">
            <span className="app-panel-title">Open defects · Unit 412</span>
            <span className="pill red">2 unsafe</span>
          </div>
          <div className="s1-defect-row">
            <div className="s1-rail" style={{ background: 'var(--st-overdue)' }} />
            <div style={{ flex: 1 }}>
              <b>Cracked windshield — driver side</b>
              <div className="s1-meta">Reported by M. Herrera · Pre-trip 8/12 · DVIR #4482</div>
              <div className="s1-thumbs">
                <img className="s1-thumb" src="img/defect_windshield.jpg" alt="" onClick={() =>
                  setLb({ img: 'img/defect_windshield.jpg', caption: 'Foto del driver · pin marca el impacto', pin: { x: '76%', y: '22%' } })} />
                <div className="s1-thumb-more">+2</div>
              </div>
            </div>
            <button className="btn primary sm" style={{ alignSelf: 'center' }}>Create WO</button>
          </div>
          <div className="s1-defect-row">
            <div className="s1-rail" style={{ background: 'var(--st-upcoming)' }} />
            <div style={{ flex: 1 }}>
              <b>Roadside — trailer brake drag</b>
              <div className="s1-meta">Reported by J. Ortiz · En route I-40 · photo attached</div>
              <div className="s1-thumbs">
                <img className="s1-thumb" src="img/defect_flat_tire.jpg" alt="" onClick={() =>
                  setLb({ img: 'img/defect_flat_tire.jpg', caption: 'Foto en carretera — el dispatcher ve el contexto real' })} />
              </div>
            </div>
            <button className="btn ghost sm" style={{ alignSelf: 'center' }}>Assign</button>
          </div>
        </div>
        <div>
          <div className="s4-variant-label">Al cerrar la WO · prueba antes / después</div>
          <BeforeAfter />
          <p className="demo-note">Arrastrá el divisor. La foto "después" queda pegada a la WO:
            cierre con evidencia, no con un checkbox.</p>
        </div>
      </div>
      {lb && <Lightbox {...lb} onClose={() => setLb(null)} />}
    </section>
  );
}

/* ============================================================
   S2 · Walkaround guiado (driver, móvil)
   ============================================================ */
const S2_ZONES = [
  { name: 'Lights & reflectors', hint: 'Walk the front. Headlights, turn signals, reflectors.', img: 'img/truck_kenworth_2.jpg' },
  { name: 'Tires & wheels', hint: 'All axles. Tread, inflation, lug nuts, leaks.', img: 'img/tires_stack.jpg' },
  { name: 'Coupling & air lines', hint: 'Fifth wheel locked, glad hands seated, no chafing.', img: 'img/defect_flat_tire.jpg' },
  { name: 'In-cab & gauges', hint: 'Brakes, horn, wipers, warning lights off.', img: 'img/cab_interior.jpg' },
  { name: 'Reefer unit', hint: 'Setpoint vs box temp, fuel level, door seals.', img: 'img/reefer_carrier.jpg' },
];

function WalkaroundApp() {
  const [i, setI] = useState(0);
  const [shots, setShots] = useState({});
  const [verdicts, setVerdicts] = useState({});
  const [finished, setFinished] = useState(false);
  const zone = S2_ZONES[i];
  const shot = shots[i]; const verdict = verdicts[i];
  const canNext = shot && verdict;

  if (finished) {
    return (
      <div className="s2-screen" style={{ minHeight: '100%' }}>
        <div className="s2-done">
          <div className="s2-done-badge">✓</div>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 22, fontWeight: 700 }}>Pre-trip complete</div>
          <div style={{ color: 'var(--text-muted)', fontSize: 13.5 }}>
            5 zones · {Object.values(verdicts).filter(v => v === 'bad').length} defect flagged · 5 photos<br />
            DVIR firmado y enviado a Rigsmith
          </div>
          <button className="btn primary" style={{ marginTop: 8 }} onClick={() => { setI(0); setShots({}); setVerdicts({}); setFinished(false); }}>
            Reiniciar demo
          </button>
        </div>
      </div>
    );
  }
  return (
    <div className="s2-screen" style={{ minHeight: '100%' }}>
      <div className="s2-top">
        <div className="s2-prog">
          {S2_ZONES.map((_, k) => <i key={k} className={k < i ? 'done' : k === i ? 'cur' : ''} />)}
        </div>
        <div className="s2-zone-eyebrow">Pre-trip · zone {i + 1} of {S2_ZONES.length}</div>
        <div className="s2-zone-name">{zone.name}</div>
        <div style={{ fontSize: 13, color: 'var(--text-muted)' }}>{zone.hint}</div>
      </div>
      <div className={'s2-photo' + (shot ? ' filled' : '')} onClick={() => setShots({ ...shots, [i]: true })}>
        {shot ? (<>
          <img src={zone.img} alt="" />
          <span className="s2-shot-ok">✓ PHOTO</span>
        </>) : (
          <div className="s2-photo-cta">
            <div className="s2-cam">📷</div>
            <span>Tap to take photo</span>
          </div>
        )}
      </div>
      <div className="s2-verdict">
        <button className={'ok' + (verdict === 'ok' ? ' sel' : '')} onClick={() => setVerdicts({ ...verdicts, [i]: 'ok' })}>✓ OK</button>
        <button className={'bad' + (verdict === 'bad' ? ' sel' : '')} onClick={() => setVerdicts({ ...verdicts, [i]: 'bad' })}>✗ Defect</button>
      </div>
      {verdict === 'bad' && (
        <div className="s2-note">
          <textarea rows="2" defaultValue="Crack on driver-side windshield, spreading from top right." />
        </div>
      )}
      <div className="s2-foot">
        {i > 0 && <button className="btn ghost" onClick={() => setI(i - 1)}>Back</button>}
        <button className="btn primary" disabled={!canNext} style={{ opacity: canNext ? 1 : .4 }}
          onClick={() => i === S2_ZONES.length - 1 ? setFinished(true) : setI(i + 1)}>
          {i === S2_ZONES.length - 1 ? 'Sign & submit' : 'Next zone'}
        </button>
      </div>
    </div>
  );
}

function S2() {
  return (
    <section className="sec" id="s2">
      <div className="sec-head">
        <span className="sec-num">02</span>
        <span className="sec-title">Walkaround guiado con foto por zona</span>
        <span className="sec-chips">
          <span className="chip driver">driver</span>
          <span className="chip effort">esfuerzo L</span>
        </span>
      </div>
      <p className="sec-why">
        El pre-trip deja de ser un formulario que se llena desde la cama. La app <b>camina el camión
        con el driver</b>: una zona por pantalla, foto obligatoria, OK o defecto. Cada DVIR nace con
        evidencia — y el defecto ya entra al pipeline del elemento 01. Probalo: es una demo operable.
      </p>
      <div className="s2-wrap">
        <IosFrame width={340} height={700} time="6:42">
          <WalkaroundApp />
        </IosFrame>
        <div className="s2-side">
          <h4>Por qué esto y no un formulario</h4>
          <ul>
            <li><b>Foto obligatoria por zona</b> = el walkaround ocurrió de verdad. Es el anti-"pencil whipping" — auditable ante DOT.</li>
            <li>Un defecto marcado acá <b>ya trae foto + nota + zona</b>: el elemento 01 no pide trabajo extra al driver.</li>
            <li>Zonas configurables por el manager — eso es exactamente el <b>editor del elemento 03</b>.</li>
            <li>Timestamp + GPS por foto (viene gratis del teléfono) = defensa en disputas de warranty y roadside.</li>
            <li>Funciona como PWA en el teléfono del driver — <b>sin app store</b>, mismo backend.</li>
          </ul>
        </div>
      </div>
    </section>
  );
}

/* ============================================================
   S3 · Editor de workflows (manager) con preview en vivo
   ============================================================ */
const S3_TYPES = {
  check: { ic: '☑', name: 'Checklist item' },
  photo: { ic: '📷', name: 'Photo required' },
  read: { ic: '🔢', name: 'Reading / input' },
  sign: { ic: '✍', name: 'Signature' },
};
let s3id = 100;
function S3() {
  const [steps, setSteps] = useState([
    { id: 1, type: 'photo', label: 'Lights & reflectors', oblig: true },
    { id: 2, type: 'photo', label: 'Tires & wheels', oblig: true },
    { id: 3, type: 'check', label: 'Coupling & air lines', oblig: true },
    { id: 4, type: 'read', label: 'Odometer reading', oblig: false },
    { id: 5, type: 'sign', label: 'Driver signature', oblig: true },
  ]);
  const [sel, setSel] = useState(1);
  const cur = steps.find(s => s.id === sel);
  const move = (id, dir) => {
    const k = steps.findIndex(s => s.id === id); const j = k + dir;
    if (j < 0 || j >= steps.length) return;
    const next = [...steps]; [next[k], next[j]] = [next[j], next[k]]; setSteps(next);
  };
  const add = (type) => {
    const st = { id: ++s3id, type, label: S3_TYPES[type].name, oblig: false };
    setSteps([...steps, st]); setSel(st.id);
  };
  return (
    <section className="sec" id="s3">
      <div className="sec-head">
        <span className="sec-num">03</span>
        <span className="sec-title">Editor de workflows del driver</span>
        <span className="sec-chips">
          <span className="chip manager">manager</span>
          <span className="chip effort">esfuerzo XL · el moat</span>
        </span>
      </div>
      <p className="sec-why">
        Cada flota inspecciona distinto: reefer, flatbed, tanker. Acá el manager <b>arma el pre-trip
        de su flota</b> — agrega pasos, exige foto, reordena — y ve <b>en vivo</b> lo que el driver
        va a recibir en el teléfono. Ningún competidor del segmento tiene esto con este nivel de
        agilidad. Probá: agregá un paso, tocá un paso para configurarlo.
      </p>
      <div className="s3-wrap">
        <div className="app-panel">
          <div className="app-panel-head">
            <span className="app-panel-title">Workflow · Reefer pre-trip</span>
            <span className="pill green">Active · 6 drivers</span>
          </div>
          <div className="s3-palette">
            {Object.entries(S3_TYPES).map(([k, t]) =>
              <button key={k} className="s3-pal-btn" onClick={() => add(k)}>
                <span>{t.ic}</span> + {t.name}
              </button>)}
          </div>
          <div className="s3-steps">
            {steps.map((s, k) => (
              <div key={s.id} className={'s3-step' + (s.id === sel ? ' sel' : '')} onClick={() => setSel(s.id)}>
                <span className="grip">⠿</span>
                <span className="ic">{S3_TYPES[s.type].ic}</span>
                <span className="lbl">
                  <b>{s.label}</b>
                  <span>{S3_TYPES[s.type].name}</span>
                </span>
                <span className="s3-flags">
                  {s.type === 'photo' && <span className="s3-flag on">FOTO</span>}
                  {s.oblig && <span className="s3-flag on">OBLIG.</span>}
                </span>
                <span className="s3-mv">
                  <button onClick={e => { e.stopPropagation(); move(s.id, -1); }}>▲</button>
                  <button onClick={e => { e.stopPropagation(); move(s.id, +1); }}>▼</button>
                </span>
              </div>
            ))}
          </div>
          {cur && (
            <div className="s3-config">
              <div style={{ fontSize: 12, letterSpacing: '.1em', textTransform: 'uppercase', color: 'var(--text-muted)', fontWeight: 700 }}>
                Config · {cur.label}
              </div>
              <div className="s3-config-row">
                <span>Obligatorio (bloquea el submit)</span>
                <div className={'s3-toggle' + (cur.oblig ? ' on' : '')}
                  onClick={() => setSteps(steps.map(s => s.id === cur.id ? { ...s, oblig: !s.oblig } : s))} />
              </div>
              <div className="s3-config-row">
                <span>Requiere foto</span>
                <div className={'s3-toggle' + (cur.type === 'photo' ? ' on' : '')}
                  onClick={() => setSteps(steps.map(s => s.id === cur.id ? { ...s, type: s.type === 'photo' ? 'check' : 'photo' } : s))} />
              </div>
            </div>
          )}
        </div>
        <div className="s3-preview-wrap">
          <div className="s3-preview-label">Preview en vivo — lo que ve el driver</div>
          <div style={{ display: 'flex', justifyContent: 'center' }}>
            <div className="s3-phone-scale">
              <IosFrame width={340} height={680} time="6:42">
                <div className="s2-screen" style={{ minHeight: '100%' }}>
                  <div className="s2-top">
                    <div className="s2-zone-eyebrow">Reefer pre-trip · Unit 418</div>
                    <div className="s2-zone-name" style={{ fontSize: 20 }}>{steps.length} steps</div>
                  </div>
                  <div>
                    {steps.map((s, k) => (
                      <div key={s.id} className="s3-drv-step">
                        <span className="num">{k + 1}</span>
                        <span className="t">{s.label}</span>
                        {s.type === 'photo' && <span style={{ fontSize: 14 }}>📷</span>}
                        {s.oblig && <span className="req">REQ</span>}
                      </div>
                    ))}
                  </div>
                  <div className="s2-foot">
                    <button className="btn primary" style={{ flex: 1 }}>Start walkaround</button>
                  </div>
                </div>
              </IosFrame>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ============================================================
   S4 · Guías y tutoriales in-app
   ============================================================ */
function S4() {
  const [coach, setCoach] = useState(0);
  const tips = [
    { kpi: 0, t: 'Fleet CPM', p: 'Tu costo por milla real: todo lo gastado en mantenimiento dividido por las millas del ELD.' },
    { kpi: 1, t: 'Preventive vs Reactive', p: 'Cuánto de tu gasto fue planificado. Arriba de 60% preventivo = flota sana.' },
    { kpi: 2, t: 'Open defects', p: 'Defectos reportados sin WO. Click acá para verlos y despacharlos.' },
  ];
  const kpis = [
    { k: 'Fleet CPM', v: '$0.187/mi' },
    { k: 'Preventive share', v: '64%' },
    { k: 'Open defects', v: '7' },
  ];
  return (
    <section className="sec" id="s4">
      <div className="sec-head">
        <span className="sec-num">04</span>
        <span className="sec-title">Guías y tutoriales dentro de la app</span>
        <span className="sec-chips">
          <span className="chip manager">onboarding</span>
          <span className="chip effort">esfuerzo S–M</span>
        </span>
      </div>
      <p className="sec-why">
        Autoservicio: el objetivo es que un shop se onboardee <b>sin llamarte</b>. Tres instrumentos
        que se complementan — coach marks para la primera vez, un centro de guías con progreso para
        las primeras semanas, y tooltips «?» permanentes para cada métrica nueva.
      </p>
      <div className="s4-grid">
        <div>
          <div className="s4-variant-label">A · Coach marks (primera visita)</div>
          <div className="s4-coach-stage">
            {kpis.map((x, k) => (
              <div key={k} className={'s4-kpi' + (tips[coach].kpi === k ? ' spot' : '')}>
                <div className="k">{x.k} <span className="s4-q">?<span className="pop">{tips[k].p}</span></span></div>
                <div className="v">{x.v}</div>
              </div>
            ))}
            <div className="s4-tip">
              <b>{tips[coach].t}</b>
              <p>{tips[coach].p}</p>
              <div className="s4-tip-foot">
                <span className="s4-tip-count">{coach + 1} / {tips.length}</span>
                <div style={{ display: 'flex', gap: 8 }}>
                  <button className="btn ghost sm" onClick={() => setCoach(0)}>Skip</button>
                  <button className="btn primary sm" onClick={() => setCoach((coach + 1) % tips.length)}>
                    {coach === tips.length - 1 ? 'Done' : 'Next'}
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div>
          <div className="s4-variant-label">B · Centro de guías (primeras semanas)</div>
          <div className="app-panel" style={{ padding: '16px 20px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
              <b style={{ fontFamily: 'var(--font-display)' }}>Get set up</b>
              <span style={{ fontSize: 12, color: 'var(--text-muted)', fontWeight: 700 }}>4 de 6</span>
            </div>
            <div className="s4-gprog"><i style={{ width: '66%' }} /></div>
            {[
              ['Import your fleet', true], ['Connect ELD (or demo)', true],
              ['First work order', true], ['Set PM schedules', true],
              ['Invite your drivers', false], ['Build your pre-trip workflow', false],
            ].map(([t, done], k) => (
              <div key={k} className="s4-guide-item">
                <span className={'s4-check' + (done ? ' done' : '')}>{done ? '✓' : ''}</span>
                <span style={{ flex: 1, color: done ? 'var(--text-muted)' : 'var(--text)' }}>{t}</span>
                {!done && <button className="btn ghost sm">Go</button>}
              </div>
            ))}
          </div>
        </div>
        <div>
          <div className="s4-variant-label">C · Video-guías (60–90 seg)</div>
          <div className="app-panel" style={{ padding: '16px 16px 10px' }}>
            {[
              ['Crear una WO desde un defecto', '1:12', 'img/mechanic_1.jpg'],
              ['Leer el reporte de CPM', '0:58', 'img/mechanic_2.jpg'],
              ['Configurar el walkaround', '1:30', 'img/cab_interior.jpg'],
            ].map(([t, d, im], k) => (
              <div key={k} className="s4-video">
                <div style={{ position: 'relative' }}>
                  <img src={im} alt="" />
                  <div className="play"><i>▶</i></div>
                </div>
                <div>
                  <div className="vt">{t}</div>
                  <div className="vd">{d} · español / english</div>
                </div>
              </div>
            ))}
            <p className="demo-note" style={{ padding: '4px 4px 8px' }}>
              Thumbs = fotos reales del taller, no ilustraciones. Los videos se graban con la app
              real (Loom-style), 90 segundos máximo.
            </p>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ============================================================
   S5 · Identidad visual de unidades
   ============================================================ */
const S5_UNITS = [
  { u: '412', sub: 'Freightliner Cascadia · 2019', img: 'img/truck_cascadia_1.jpg', st: 'On track', pill: 'green' },
  { u: '418', sub: 'Kenworth W900 · 2016', img: 'img/truck_kenworth_1.jpg', st: 'PM due', pill: 'yellow' },
  { u: '305', sub: 'Freightliner Cascadia · 2021', img: 'img/truck_cascadia_2.jpg', st: 'On track', pill: 'green' },
  { u: '53108', sub: 'Reefer trailer · Carrier', img: 'img/reefer_carrier.jpg', st: 'Overdue', pill: 'red' },
];
function S5() {
  const [mode, setMode] = useState('prop');
  return (
    <section className="sec" id="s5">
      <div className="sec-head">
        <span className="sec-num">05</span>
        <span className="sec-title">Identidad visual de unidades</span>
        <span className="sec-chips">
          <span className="chip manager">fleet</span>
          <span className="chip effort">esfuerzo S</span>
        </span>
      </div>
      <p className="sec-why">
        Un dueño no piensa «unit 412», piensa <b>«la Cascadia blanca»</b>. Una foto por unidad
        (subida una sola vez, o capturada en el primer walkaround) convierte la lista de la flota en
        algo que se reconoce de un vistazo. Compará:
      </p>
      <div className="s5-toggle">
        <button className={mode === 'hoy' ? 'on' : ''} onClick={() => setMode('hoy')}>Hoy</button>
        <button className={mode === 'prop' ? 'on' : ''} onClick={() => setMode('prop')}>Propuesta</button>
      </div>
      {mode === 'prop' ? (<>
        <div className="s5-hero">
          <img src="img/truck_cascadia_1.jpg" alt="" />
          <div className="veil" />
          <div className="inner">
            <div className="unit">UNIT 412</div>
            <div className="sub">Freightliner Cascadia 2019 · VIN …8841 · Summit Freight</div>
            <div className="stats">
              <div className="st"><div className="l">Odometer</div><div className="v">493,208 mi</div></div>
              <div className="st"><div className="l">CPM</div><div className="v">$0.171/mi</div></div>
              <div className="st"><div className="l">Next PM</div><div className="v">2,300 mi</div></div>
              <div className="st"><div className="l">Open WOs</div><div className="v">1</div></div>
            </div>
          </div>
        </div>
        <div className="s5-cards">
          {S5_UNITS.map(x => (
            <div key={x.u} className="s5-card">
              <div className="ph">
                <img src={x.img} alt="" />
                <span className={'pill stpill ' + x.pill}>{x.st}</span>
              </div>
              <div className="bd"><b>{x.u}</b><span>{x.sub}</span></div>
            </div>
          ))}
        </div>
      </>) : (
        <div className="app-panel s5-rows">
          {S5_UNITS.map(x => (
            <div key={x.u} className="s5-row">
              <div className="s5-nophoto" />
              <b>{x.u}</b>
              <span>{x.sub}</span>
              <span className={'pill ' + x.pill}>{x.st}</span>
            </div>
          ))}
        </div>
      )}
      <p className="demo-note">La foto del hero reutiliza la del primer walkaround si el dueño nunca sube una — cero fricción.</p>
    </section>
  );
}

/* ============================================================
   S6 · Dónde SÍ y dónde NO va la foto de stock
   ============================================================ */
function S6() {
  return (
    <section className="sec" id="s6">
      <div className="sec-head">
        <span className="sec-num">06</span>
        <span className="sec-title">Fotos de stock: dónde sí, dónde no</span>
        <span className="sec-chips"><span className="chip effort">esfuerzo S</span></span>
      </div>
      <p className="sec-why">
        El stock tratado con el duotono Rigsmith (B&N + velo rojo) le da peso industrial al login,
        al onboarding y a los empty states. Pero en pantallas de datos <b>es ruido</b>. Regla simple:
        stock donde no hay datos todavía; datos donde ya los hay.
      </p>
      <div className="s6-grid">
        <div className="s6-login">
          <img src="img/truck_kenworth_1.jpg" alt="" />
          <div className="tint" />
          <div className="inner">
            <div className="wordmark">RIGSMITH<span>.</span></div>
            <div className="tag">Your fleet, forged right.</div>
            <div style={{ display: 'flex', gap: 10, marginTop: 16 }}>
              <button className="btn primary">Sign in</button>
              <button className="btn ghost">Request access</button>
            </div>
          </div>
        </div>
        <div className="s6-rules">
          <div className="s6-rule si"><b>SÍ — login y onboarding</b>
            <p>Primera impresión. Duotono B&N + velo rojo marca: se ve caro, no genérico.</p></div>
          <div className="s6-rule si"><b>SÍ — empty states</b>
            <p>«Sin work orders todavía» con un taller de fondo apenas visible invita a crear la primera, en vez de mostrar una tabla vacía.</p></div>
          <div className="s6-rule si"><b>SÍ — thumbnails de guías</b>
            <p>Como en el elemento 04: una foto real de taller dice «esto es para tu mundo».</p></div>
          <div className="s6-rule no"><b>NO — dashboards y tablas</b>
            <p>Compiten con los datos. El cockpit queda denso y limpio como está.</p></div>
          <div className="s6-rule no"><b>NO — decorar cada tarjeta</b>
            <p>Foto sin función = slop. Si al quitarla no se pierde información, no va.</p></div>
        </div>
      </div>
    </section>
  );
}

/* ===== Board ===== */
function Board() {
  return (
    <div className="board">
      <div className="board-head">
        <div className="board-logo"><b>R</b><span>.</span></div>
        <div className="board-title">Propuesta · Fotos, guías y workflows</div>
      </div>
      <p className="board-sub">
        Seis instrumentos para el salto de interactividad y user-friendliness. Todo está renderizado
        con los tokens reales del design system (rojo #E11900, Space Grotesk, radios y sombras de la
        app) — lo que ves es como se vería. <b>Cada demo es operable: click, arrastre, toggles.</b>
      </p>
      <div className="assump">
        <b>Assumptions del junior pass:</b> (1) el driver usa el teléfono como PWA, sin app nativa;
        (2) las fotos se guardan en el backend actual (media_host) con thumbnail + GPS + timestamp;
        (3) copy de la app en inglés, como el producto; (4) fotos de muestra = Wikimedia Commons,
        para producción se cambian por Unsplash/Pexels con licencia o fotos del cliente. Corregime
        lo que esté mal antes del full pass.
      </div>
      <div className="toc">
        <a href="#s1"><span className="n">01</span>Evidencia fotográfica</a>
        <a href="#s2"><span className="n">02</span>Walkaround guiado</a>
        <a href="#s3"><span className="n">03</span>Editor de workflows</a>
        <a href="#s4"><span className="n">04</span>Guías y tutoriales</a>
        <a href="#s5"><span className="n">05</span>Identidad de unidades</a>
        <a href="#s6"><span className="n">06</span>Stock: sí / no</a>
      </div>
      <S1 /><S2 /><S3 /><S4 /><S5 /><S6 />
      <div className="board-foot">
        Prototipo interno Rigsmith · Fotos de muestra: Wikimedia Commons (CC BY / CC BY-SA / dominio
        público) — solo para este board; producción usará fotos licenciadas o del cliente.
        · Board generado sobre los tokens de <code>frontend/src/index.css</code>.
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Board />);
</script>
</body>
