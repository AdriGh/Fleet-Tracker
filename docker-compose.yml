# Fleet Tracker — stack de produccion: Postgres + app (API + frontend).
#
# Pensado para Dokploy/VPS (tambien sirve para correr local con Docker).
# Variables sensibles se leen de un archivo .env junto a este compose (ver
# DEPLOY.md). NO commitear .env ni la carpeta ./secrets.

services:
  # -------------------------------------------------------------------------
  # Base de datos Postgres (persistente en el volumen pgdata)
  # -------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet}
      POSTGRES_DB: ${POSTGRES_DB:-fleet}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # depends_on espera a que Postgres acepte conexiones antes de arrancar app
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleet} -d ${POSTGRES_DB:-fleet}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # App: FastAPI + frontend compilado, en un solo contenedor
  # -------------------------------------------------------------------------
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Postgres por COMPONENTES (no DATABASE_URL pre-armada): config.py la arma
      # con sqlalchemy.URL.create, que CODIFICA los caracteres especiales de la
      # contraseña (@ : / ...). Antes se pegaba la clave cruda y una con '@'
      # rompia la URL (el host quedaba '@db'). El driver es psycopg3.
      POSTGRES_USER: ${POSTGRES_USER:-fleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet}
      POSTGRES_DB: ${POSTGRES_DB:-fleet}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # El server escucha en 0.0.0.0:8000 (lo fija el CMD del Dockerfile).
      DVIR_HOST: 0.0.0.0
      DVIR_PORT: "8000"
      # Directorio donde el SecretStore busca los <name>.local.json. Apunta al
      # ./secrets montado abajo. Si la carpeta esta vacia, cada integracion
      # arranca en modo offline/degradado (la app igual corre). Ver DEPLOY.md.
      FLEET_SECRETS_DIR: /app/secrets
      # docscan (escaneo AI de facturas). Estas DOS variables DEBEN listarse
      # AQUI para que Compose las inyecte al contenedor: el panel de Dokploy
      # las guarda en el .env, que Compose usa SOLO para interpolar ${...} en
      # este archivo. Si no estan en este bloque NO llegan al proceso (printenv
      # vacio) y resolved_provider() cae a 'auto' -> Ollama. Con esto,
      # DOCSCAN_PROVIDER=groq del .env activa el escaneo rapido en LPU de Groq.
      # Ver docscan.py / DEPLOY.md.
      DOCSCAN_PROVIDER: ${DOCSCAN_PROVIDER:-auto}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      # host:contenedor — exponer 8765 afuera para no chocar con otros 8000.
      # En Dokploy normalmente NO se publica el puerto: el proxy interno (Traefik)
      # enruta al 8000 del contenedor por dominio. Ver DEPLOY.md.
      - "${APP_PORT:-8765}:8000"
    volumes:
      # Persistencia de archivos subidos (PDFs de invoices de WO, docs de unidad)
      # y Excel temporales. VOLÚMENES NOMBRADOS (no binds a ./): Dokploy re-clona
      # el repo en cada deploy y borraría un bind a ./data → se perderían los
      # PDFs. Los volúmenes nombrados persisten como pgdata.
      - fleet_uploads:/app/backend/uploads
      - fleet_jobs:/app/backend/.jobs
      # SECRETOS en runtime (auth_secret que firma las sesiones + credenciales
      # de integraciones guardadas por la UI). VOLUMEN NOMBRADO (no bind): un
      # bind a ./secrets se PERDÍA cuando Dokploy re-clonaba el repo en cada
      # deploy → el auth_secret se regeneraba (deslogueos) y el dir podía faltar
      # (login 500). El volumen nombrado persiste como pgdata. docscan se
      # configura por env (DOCSCAN_PROVIDER/GROQ_API_KEY), sin dropear archivos.
      - fleet_secrets:/app/secrets

volumes:
  pgdata:
  fleet_secrets:
  fleet_uploads:
  fleet_jobs:
